# tether's tmux server configuration. Passed as `tmux -L <socket> -f <this file>` on
# every invocation, so the user's ~/.tmux.conf can never reach a tether session — see
# report section 2, where dotfile leakage was verified to silently change history-limit.
#
# Every line here is load-bearing for reconnection (report section 3). Do not trim.

# A status bar steals a row from the attaching client, which reflows the window and
# silently drops one line of scrollback. This cost the spike a line out of 300.
set -g status off

# A phone attaching must not resize every other viewer's session.
set -g window-size manual

# Must be set before a pane produces output: raising it later does not recover
# evicted lines, and #{history_limit} reports the option, not what the pane retains.
set -g history-limit 100000

# tether's UI owns scrolling, not the TUI.
set -g mouse off

# Explicit because tmux older than 3.7b shipped 500ms, and Esc is how you interrupt
# Claude Code.
set -g escape-time 10

# Explicit because tmux older than 3.7b shipped screen-256color.
set -g default-terminal tmux-256color
