name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1
  TMUX_VERSION: 3.7b
  TMUX_SHA256: 87f2e99e3b685973f2ca002ffd6ed7e51a5744f7009daae5a15670b6d532db96

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks scans history, not just the working tree.
          fetch-depth: 0

      # The installer is shell, so none of the checks below see it. Its own
      # --self-test covers the branches that can be silently wrong: the version
      # parsing, the PATH message, and the two Funnel questions — whether the
      # tailnet permits it and whether it is already armed — neither of which
      # may be answered from the other's field. Runs before anything expensive:
      # it needs nothing installed and takes milliseconds.
      - name: Installer
        run: |
          shellcheck install.sh
          bash install.sh --self-test

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Integration tests from PR #2 onwards drive a real tmux server, and tether.conf
      # sets `window-size manual`. tmux before 3.7 sizes a session that has no window
      # yet by dereferencing that NULL window, so every detached `new-session` kills
      # the server (fixed upstream in 3.7's resize.c). ubuntu-latest's apt tmux is 3.4,
      # so build the pinned release instead.
      # `build-essential` and `python3` are also what node-gyp needs: `node-pty`
      # ships no Linux prebuild, so `npm ci` compiles it from source.
      - name: Install tmux
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 bison libevent-dev libncurses-dev pkg-config
          tarball="tmux-${TMUX_VERSION}.tar.gz"
          curl -sSfL -o "${RUNNER_TEMP}/${tarball}" \
            "https://github.com/tmux/tmux/releases/download/${TMUX_VERSION}/${tarball}"
          echo "${TMUX_SHA256}  ${RUNNER_TEMP}/${tarball}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${tarball}" -C "${RUNNER_TEMP}"
          cd "${RUNNER_TEMP}/tmux-${TMUX_VERSION}"
          ./configure
          make -j"$(nproc)"
          sudo make install
          tmux -V

      - run: npm ci

      # Whether a terminal can start at all — an unbuildable `node-pty`, or a
      # `spawn-helper` without its executable bit, otherwise fails at the first
      # attach, long after this job has gone green. The same command `install.sh`
      # runs on a user's machine, and the same one that carries the only evidence
      # about macOS obtainable here: this runner holds the darwin prebuilds, so
      # it can prove the root postinstall set their bit even though it cannot use
      # them. server/src/machine/pty-smoke.ts says what it checks and why.
      - name: Verify a terminal can start
        run: npm run check:pty

      - name: Typecheck
        run: npm run typecheck

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # npm 12 blocks the `playwright` package's own postinstall, so the browser
      # is fetched explicitly — which is what a developer runs too, and is why a
      # plain `npm ci` does not pay for a 100MB download it may never use.
      - name: Install Playwright's browser
        run: npx playwright install --with-deps chromium

      # The one thing no unit test can say: log in, start a session against the
      # stub agent, type at it, reload, and get everything back exactly once.
      # Needs `web/dist` and a working `node-pty`, both proven by the steps above.
      - name: End-to-end
        run: npm run test:e2e

      - name: Scan for secrets
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "${RUNNER_TEMP}/${tarball}" "${base}/${tarball}"
          curl -sSfL "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" \
            | grep " ${tarball}\$" | (cd "${RUNNER_TEMP}" && sha256sum -c -)
          tar -xzf "${RUNNER_TEMP}/${tarball}" -C /usr/local/bin gitleaks
          gitleaks git --redact --verbose .
