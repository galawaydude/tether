name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: true
  ACTIONLINT_VERSION: 1.7.12
  GITLEAKS_VERSION: 8.30.1
  TMUX_VERSION: 3.7b
  TMUX_SHA256: 87f2e99e3b685973f2ca002ffd6ed7e51a5744f7009daae5a15670b6d532db96

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate installer
        run: |
          shellcheck install.sh
          bash install.sh --self-test

      - name: Validate GitHub Actions
        env:
          VERSION: ${{ env.ACTIONLINT_VERSION }}
        run: |
          set -euo pipefail
          base="https://github.com/rhysd/actionlint/releases/download/v${VERSION}"
          tarball="actionlint_${VERSION}_linux_amd64.tar.gz"
          curl -sSfL --proto '=https' -o "${RUNNER_TEMP}/${tarball}" "${base}/${tarball}"
          curl -sSfL --proto '=https' "${base}/actionlint_${VERSION}_checksums.txt" \
            | grep " ${tarball}\$" | (cd "${RUNNER_TEMP}" && sha256sum -c -)
          tar -xzf "${RUNNER_TEMP}/${tarball}" -C "${RUNNER_TEMP}" actionlint
          "${RUNNER_TEMP}/actionlint" -color

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify native PTY
        run: npm run check:pty

      - name: Typecheck
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up tmux
        uses: ./.github/actions/setup-tmux
        with:
          version: ${{ env.TMUX_VERSION }}
          sha256: ${{ env.TMUX_SHA256 }}

      - name: Install dependencies
        run: npm ci

      - name: Run unit and integration tests
        run: npm test

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up tmux
        uses: ./.github/actions/setup-tmux
        with:
          version: ${{ env.TMUX_VERSION }}
          sha256: ${{ env.TMUX_SHA256 }}

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:e2e

      - name: Upload browser-test evidence
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Scan repository history for secrets
        env:
          VERSION: ${{ env.GITLEAKS_VERSION }}
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          tarball="gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfL --proto '=https' -o "${RUNNER_TEMP}/${tarball}" "${base}/${tarball}"
          curl -sSfL --proto '=https' "${base}/gitleaks_${VERSION}_checksums.txt" \
            | grep " ${tarball}\$" | (cd "${RUNNER_TEMP}" && sha256sum -c -)
          tar -xzf "${RUNNER_TEMP}/${tarball}" -C "${RUNNER_TEMP}" gitleaks
          "${RUNNER_TEMP}/gitleaks" git --redact --verbose .

  ci:
    name: CI
    if: always()
    needs:
      - quality
      - test
      - e2e
      - security
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every CI job
        env:
          QUALITY: ${{ needs.quality.result }}
          TEST: ${{ needs.test.result }}
          E2E: ${{ needs.e2e.result }}
          SECURITY: ${{ needs.security.result }}
        run: |
          for result in "$QUALITY" "$TEST" "$E2E" "$SECURITY"; do
            [ "$result" = success ] || exit 1
          done
